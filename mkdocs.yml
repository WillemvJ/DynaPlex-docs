site_name: DynaPlex
site_description: >-
  Solving Markov Decision Problems and similar models (POMDP, HMM), written in
  Python, executed by a fast multi-threaded engine — for Supply Chain,
  Logistics and Manufacturing.
site_url: https://dynaplex.github.io/DynaPlex/
repo_url: https://github.com/DynaPlex/DynaPlex
repo_name: DynaPlex/DynaPlex
edit_uri: edit/main/docs/

theme:
  name: material
  logo: assets/images/icon.png
  favicon: assets/images/icon.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - search.suggest
    - search.highlight
    - toc.follow

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Getting started:
      - Installation: getting-started/installation.md
      - Verifying your installation: getting-started/verifying-installation.md
      - A brief introduction to MDPs: getting-started/introduction-to-mdps.md
  - Tutorials:
      - Airplane ticket selling MDP: tutorials/airplane-mdp.md
      - Airplane MDP — Python code: tutorials/airplane-mdp-code.md
      - Bin packing MDP: tutorials/binpacking-mdp.md
      - Bin packing MDP — Python code: tutorials/binpacking-mdp-code.md
  - Reference:
      - Language reference: reference/language-reference.md
  - Community:
      - Getting help: community/getting-help.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.snippets:
      base_path: [docs]
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.arithmatex:
      generic: true
  - toc:
      permalink: true

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

extra:
  version:
    provider: mike
