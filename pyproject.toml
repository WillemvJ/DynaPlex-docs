[tool.poetry]
name = "dynaplex"
# No hardcoded version: this is only the docs build env (package-mode = false).
# The documented version is derived from the published PyPI release in conf.py.
description = "A software library for solving Markov Decision Problems and similar models."
authors = [
    "Willem van Jaarsveld",
]
license = "MIT"
readme = "README.md"
package-mode = false

exclude = [
    "build",
]

[tool.poetry.dependencies]
python = "^3.11,<4.0"
tomli = "^2.0.1"

[tool.poetry.group.docs]
optional = true

[tool.poetry.group.docs.dependencies]
nbsphinx = ">=0.8.9"
ipython = ">=8.6.0"
numpydoc = ">=1.5.0"
sphinx-immaterial = ">=0.11.6"